<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FootZen™ — Redirecting to checkout…</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;background:#FAF9F6;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;color:#1a1a1a}
.logo{font-size:2.2rem;font-weight:900;color:#1B5E35;letter-spacing:-.04em}
.logo em{font-style:normal;color:#FF5722}
.msg{font-size:1.5rem;color:#6B7280}
.spinner{width:36px;height:36px;border:3px solid #E4E0D8;border-top-color:#1B5E35;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err{font-size:1.4rem;color:#DC2626;display:none;text-align:center;max-width:340px;line-height:1.6}
.back{font-size:1.3rem;color:#1B5E35;text-decoration:underline;cursor:pointer;display:none}
</style>
</head>
<body>
<div class="logo">Foot<em>Zen</em>™</div>
<div class="spinner" id="spin"></div>
<div class="msg" id="msg">Taking you to secure checkout…</div>
<div class="err" id="err"></div>
<a href="/" class="back" id="back">← Back to store</a>

<script>
(async () => {
  const p = new URLSearchParams(location.search);
  const size = p.get('size') || 'EU 40-41';
  const qty  = p.get('qty')  || '1';

  try {
    const res = await fetch('/api/checkout-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ size, qty: parseInt(qty) }),
    });
    const data = await res.json();
    if (data.url) {
      location.href = data.url;
    } else {
      throw new Error(data.error || 'Could not create session');
    }
  } catch (e) {
    document.getElementById('spin').style.display = 'none';
    document.getElementById('msg').style.display  = 'none';
    document.getElementById('err').style.display  = 'block';
    document.getElementById('err').textContent    = 'Payment system unavailable. Please try again in a moment.';
    document.getElementById('back').style.display = 'block';
  }
})();
</script>
</body>
</html>
